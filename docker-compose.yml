services:
  mysql:
    image: mysql:8.4
    container_name: lead-crm-mysql
    ports:
      - "${FORWARD_DB_PORT:-3307}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: lead_crm
      MYSQL_USER: lead_crm
      MYSQL_PASSWORD: secret
    volumes:
      - lead-crm-mysql:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    command:
      - --slow-query-log=ON
      - --long-query-time=0.2
      - --innodb-lock-wait-timeout=10
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-psecret"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  lead-crm-mysql:
